<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->

    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-info-subtle">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="./images/trail_logo.png" height="36" />HikeApp</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Trails</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Saved</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">My Hikes</a></li>
                <li><a class="dropdown-item" href="#">Settings</a></li>
              </ul>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>
    <!-- End of Top Navbar-->

    <!-- Hero Section Start-->
    <div class="px-3 py-5 my-2 mx-2 text-center bg-body-tertiary">
      <img
        class="d-block mx-auto mb-4"
        src="./images/trail_logo.png"
        alt=""
        width="104"
        height="96"
      />
      <h1 class="display-5 fw-bold text-body-emphasis">Let's Hike Together!</h1>
      <div class="col-lg-6 mx-auto">
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
          <button type="button" class="btn btn-info btn-lg px-4 gap-3">
            Explore Hikes
          </button>
          <button type="button" class="btn btn-outline-info btn-lg px-4">
            Read More
          </button>
        </div>
      </div>
    </div>
    <!-- Hero section Ends-->

    <!-- Start of the card group-->
    <h1 class="mx-5 mb-4">Popular Hikes</h1>
    <div class="card-group mx-5">
      <div class="card">
        <img
          src="./images/hike1.jpg"
          class="card-img-top object-fit-cover"
          height="260"
          alt="Mountain hike"
        />
        <div class="card-body">
          <h5 class="card-title">Mountain Hike</h5>
          <p class="card-text">First Option</p>
        </div>
      </div>

      <div class="card">
        <img
          src="./images/hike2.jpg"
          class="card-img-top object-fit-cover"
          height="260"
          alt="Beautiful hike"
        />
        <div class="card-body">
          <h5 class="card-title">Beautiful Hike</h5>
          <p class="card-text">Second Option</p>
        </div>
      </div>

      <div class="card">
        <img
          src="./images/hike3.jpg"
          class="card-img-top object-fit-cover"
          height="260"
          alt="Photo hike"
        />
        <div class="card-body">
          <h5 class="card-title">Photo Hike</h5>
          <p class="card-text">Third Option</p>
        </div>
      </div>
    </div>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
